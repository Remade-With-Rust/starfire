# Starfire workspace — clean-room Rust client for the Sunshine GameStream protocol.
# See docs/README.md for the engineering plan and bit-for-bit methodology.
[workspace]
resolver = "2"
members = [
    "crates/starfire-protocol",
    "crates/starfire-rt",
    "crates/starfire-alloc",
    "crates/starfire-core",
    "crates/starfire-decode",
    "crates/starfire-client",
    "crates/starfire-render",
    "crates/starfire-audio",
    "crates/starfire-input",
    "crates/starfire-testkit",
    "crates/app",
    "tools/fixture-slicer",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Remade-With-Rust/starfire"
rust-version = "1.95"

# Shared, permissive-only dependencies. cargo-deny enforces zero GPL/LGPL.
[workspace.dependencies]
thiserror = "2"
tracing = "0.1"
# protocol-core libs (added to crates as their layers land)
# Video FEC kernels: ISA-L remade in Rust (SIMD to GFNI/NEON, no C). The nanors-
# compatible Cauchy matrix is supplied by starfire-protocol::fec.
rusty_erasure = "0.4.1"
sha2 = "0.10"
aes = "0.8"
aes-gcm = "0.10"
# House XML, not quick-xml. rusty_xml-reader is the xmlTextReader pull parser
# and gives `local_name()` with the prefix already stripped plus
# `get_attribute(name)`, so the GameStream parsers lost their own helpers.
rusty_xml-reader = "0.8.1"
rcgen = "0.13"     # self-signed client identity cert (F2)
getrandom = "0.2"  # OS randomness for salt/challenge/secret (F2)
p256 = { version = "0.14", features = ["ecdsa", "pkcs8", "pem"] } # sign pairing secret (F2)
x509-parser = "0.16" # extract X.509 cert signature bytes for the hash chain (F2)
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] } # mTLS HTTPS (F3)
rustls-pki-types = { version = "1", features = ["std"] } # PEM cert/key parsing (F3)
rusty_enet = "0.4" # reliable-UDP control channel (F6)
socket2 = "0.6"    # socket options std lacks: a large SO_RCVBUF on the media sockets
# Global allocator: rusty_alloc (pure-Rust mimalloc remake). Only starfire-alloc
# may depend on these; deliverables depend on starfire-alloc. 2.2.5 is a floor.
rusty_alloc-api = "2.2.5"
rusty_alloc = "2.2.5"
# test support
toml = "0.8"
serde = { version = "1", features = ["derive"] }
# render layer (permissive: wgpu/winit are MIT/Apache-2.0). docs/04.
wgpu = "30"
# Default features minus the Wayland title-bar font renderer (sctk-adwaita's
# ab_glyph -> ttf-parser, unmaintained: RUSTSEC-2026-0192). Wayland windows keep
# client-side decorations, without title text; macOS/Windows are unaffected.
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen", "wayland-csd-adwaita-notitle"] }
pollster = "0.4"   # block_on for device request + headless readback
bytemuck = { version = "1", features = ["derive"] } # POD uniform structs
# audio layer (permissive: rusty-opus is BSD-3, cpal is Apache-2.0). docs/protocol/08.
rusty-opus = "1.1.0" # Opus decode: pure Rust (RFC 6716/8251), no C or CMake
cpal = "0.18"      # cross-platform audio output (CoreAudio / WASAPI)

# Lints that encode the baseline rules from docs/01-overview.md.
# Warn (not deny) in Phase 0 so stubs stay green; tighten to deny before Phase 1.
[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
